# Pure Gazer v0.5.4 - poloq-dev source layout
# 1280x800 Shadow coordinate space; visible plugin area y=86..714.
# r=48 produces 106px filmstrip frames, below the 128px limit.
style=shadow
label_scale=1.15
theme_bg=10111D
theme_ink=EAE5F4
theme_ink_dim=ADABC0
theme_accent=9B8BDC
theme_accent_hi=E8A6C8
theme_lcd=171526
theme_line=343047
theme_btn_bg=242035
theme_btn_text=EAE5F4
qlinks_track = size,predelay,feedback,damping,highpass

[tab SPACE]
text cx=640 cy=176 label="PURE GAZER" size=1.8
knob cx=152 cy=413 r=48 label="SIZE" key=size
knob cx=396 cy=413 r=48 label="PREDELAY" key=predelay
knob cx=640 cy=413 r=48 label="FEEDBACK" key=feedback
knob cx=884 cy=413 r=48 label="DAMPING" key=damping
knob cx=1128 cy=413 r=48 label="HIGHPASS" key=highpass
qlinks "SPACE" = size,predelay,feedback,damping,highpass

[tab SHIMMER]
text cx=640 cy=176 label="PURE GAZER" size=1.8
knob cx=152 cy=413 r=48 label="SHIMMER" key=shimmer
knob cx=396 cy=413 r=48 label="GRAIN SIZE" key=grain
knob cx=640 cy=413 r=48 label="GRAIN FB" key=grain_fb
knob cx=884 cy=413 r=48 label="PITCH" key=pitch
knob cx=1128 cy=413 r=48 label="ATTACK" key=attack
qlinks "SHIMMER" = shimmer,grain,grain_fb,pitch,attack

[tab MOTION & MIX]
text cx=640 cy=176 label="PURE GAZER" size=1.8
knob cx=152 cy=413 r=48 label="MODULATE" key=modulate
knob cx=396 cy=413 r=48 label="WIDTH" key=width
knob cx=640 cy=413 r=48 label="ORGANIZE" key=organize
knob cx=884 cy=413 r=48 label="WET" key=wet
knob cx=1128 cy=413 r=48 label="LINES" key=lines
qlinks "MOTION & MIX" = modulate,width,organize,wet,lines
