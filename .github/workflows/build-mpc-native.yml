name: Build Pure Gazer native MPC skin and wrapper
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: pure-gazer
      - uses: docker/setup-qemu-action@v3
      - name: Check out Open MPC framework
        uses: actions/checkout@v4
        with:
          repository: sd88me/mpc-vst-plugins
          path: mpc-vst-plugins
      - name: Generate skin, Q-Links, ARM VST2 and registration metadata
        run: |
          cd mpc-vst-plugins
          bash tools/build_port.sh ../pure-gazer/vst/vst.json armv7
      - name: Inspect package
        run: |
          find pure-gazer/vst/build -maxdepth 5 -type f | head -60
          file pure-gazer/vst/build/PureGazer.so
          readelf -Ws pure-gazer/vst/build/PureGazer.so | grep VSTPluginMain
      - uses: actions/upload-artifact@v4
        with:
          name: PureGazer-MPC-OS3-skin-and-wrapper-EXPERIMENTAL
          path: |
            pure-gazer/vst/build/PureGazer.so
            pure-gazer/vst/build/skin/
            pure-gazer/vst/build/pluginlist-entry.xml
          if-no-files-found: error
